name: CloudKart CI/CD Verification Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Fetch Repository Code
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite
      run: |
        pytest -v

    - name: Initialize Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Container
      run: |
        docker build -t cloudkart-service:${{ github.sha }} .

    - name: Validate Container Health
      run: |
        docker run -d -p 5000:5000 --name cloudkart-test-runner cloudkart-service:${{ github.sha }}
        sleep 4
        curl --fail http://127.0.0.1:5000/health || exit 1
        docker stop cloudkart-test-runner
